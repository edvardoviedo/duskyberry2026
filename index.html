<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Grandes cosas están en camino. Volvemos pronto.">
  <title>En construcción — Volvemos pronto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --lime: #85a840;
      --cyan: #0cc0df;
      --ink: #1e222e;
      --deep: #030716;
      --paper: #f1f1f1;
      --black: #000000;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow-x: clip;
      background: var(--black);
      color: var(--paper);
      font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
      padding: clamp(22px, 3.4vw, 48px) clamp(20px, 4.6vw, 72px) clamp(20px, 3vw, 42px);
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
      animation: fade-in .8s .12s both;
    }
    .star {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      color: var(--lime);
      overflow: visible;
      animation: star-glow 4s ease-in-out infinite;
    }
    .return {
      display: flex;
      align-items: center;
      gap: 11px;
      color: rgba(241,241,241,.65);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .19em;
      line-height: 1.4;
      white-space: nowrap;
    }
    .return::before {
      content: "";
      display: block;
      width: 25px;
      height: 1px;
      background: var(--cyan);
      transform-origin: right;
      animation: line-in 1s .6s both;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      padding: clamp(36px, 8vh, 90px) 0 clamp(20px, 4vh, 48px);
    }
    .headline {
      width: 100%;
      margin: 0;
      text-align: center;
      font-size: clamp(3.05rem, 12.6vw, 12rem);
      font-weight: 900;
      letter-spacing: -.095em;
      line-height: .77;
      text-transform: uppercase;
      animation: headline-in 1.05s cubic-bezier(.2,.75,.2,1) .08s both;
    }
    .headline span { display: block; }
    .headline .construction {
      margin-top: .12em;
      font-size: .89em;
      letter-spacing: -.092em;
      white-space: nowrap;
    }
    .headline .accent { color: var(--cyan); }
    .subtitle {
      margin: clamp(24px, 3.2vw, 39px) 0 0;
      padding-left: .25em;
      color: rgba(241,241,241,.65);
      text-align: center;
      font-size: clamp(8px, 1vw, 11px);
      font-weight: 600;
      letter-spacing: .27em;
      line-height: 1.8;
      animation: fade-in .9s .55s both;
    }
    .bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 250px);
      justify-self: center;
      gap: 11px;
      animation: fade-in .8s .6s both;
    }
    .mascot {
      width: 72px;
      height: 52px;
      overflow: visible;
      margin-bottom: -1px;
    }
    .mascot .body { animation: peek 5.2s ease-in-out infinite; transform-origin: 50% 100%; }
    .mascot .head { animation: bob 3.8s ease-in-out infinite; transform-origin: 36px 29px; }
    .mascot .eye { animation: blink 5.5s linear infinite; transform-origin: center; }
    .progress {
      position: relative;
      width: 100%;
      height: 2px;
      overflow: hidden;
      border: 1px solid var(--ink);
      background: var(--deep);
    }
    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 34%;
      background: var(--lime);
      transform: translateX(-110%);
      animation: progress-travel 3.8s cubic-bezier(.45,0,.55,1) infinite;
      will-change: transform;
    }
    .loading {
      margin: 1px 0 0;
      color: rgba(241,241,241,.42);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .24em;
      text-align: center;
    }
    .dots span { animation: dot 1.35s infinite; opacity: .15; }
    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes headline-in {
      from { opacity: 0; transform: translateY(22px); clip-path: inset(0 0 35% 0); }
      to { opacity: 1; transform: translateY(0); clip-path: inset(0); }
    }
    @keyframes star-glow {
      0%, 75%, 100% { opacity: .75; transform: scale(.92) rotate(0); }
      82% { opacity: 1; transform: scale(1.12) rotate(45deg); }
      89% { opacity: .85; transform: scale(1) rotate(90deg); }
    }
    @keyframes line-in {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes peek {
      0%, 100% { transform: translateY(4px); }
      50% { transform: translateY(0); }
    }
    @keyframes bob {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(2deg) translateY(-1.5px); }
    }
    @keyframes blink {
      0%, 43%, 47%, 77%, 81%, 100% { transform: scaleY(1); }
      45%, 79% { transform: scaleY(.12); }
    }
    @keyframes progress-travel {
      0% { transform: translateX(-110%); }
      55% { transform: translateX(205%); }
      100% { transform: translateX(330%); }
    }
    @keyframes dot {
      0%, 60%, 100% { opacity: .15; }
      30% { opacity: 1; }
    }
    @media (min-width: 1500px) {
      .headline { font-size: clamp(12rem, 12.6vw, 17rem); }
    }
    @media (max-width: 600px) {
      .page { padding: 22px 18px 24px; }
      .return { font-size: 8px; letter-spacing: .13em; gap: 8px; }
      .return::before { width: 16px; }
      main { padding: 50px 0 32px; }
      .headline { font-size: clamp(2.85rem, 12.4vw, 5.3rem); letter-spacing: -.09em; }
      .headline .construction { font-size: .86em; letter-spacing: -.085em; }
      .subtitle { max-width: 90%; letter-spacing: .17em; font-size: 8px; }
      .bottom { width: min(70%, 230px); }
    }
    @media (max-width: 350px) {
      .headline { font-size: 12vw; }
      .headline .construction { font-size: .82em; }
      .return { font-size: 7px; }
    }
    @media (max-height: 650px) and (min-width: 601px) {
      .page { padding-top: 22px; padding-bottom: 18px; }
      main { padding: 24px 0 18px; }
      .headline { font-size: clamp(4rem, 10vw, 9rem); }
      .subtitle { margin-top: 22px; }
      .mascot { width: 58px; height: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .progress-fill { transform: translateX(0); }
      .dots span { opacity: .65; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topline" aria-label="Estado del sitio">
      <svg class="star" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 0.8 12.2 7.8 19.2 10 12.2 12.2 10 19.2 7.8 12.2 .8 10 7.8 7.8Z" fill="currentColor"/>
      </svg>
      <div class="return">VOLVEMOS PRONTO</div>
    </header>

    <main>
      <h1 class="headline">
        <span>EN</span>
        <span class="construction">CONSTRU<span class="accent">C</span>CIÓN</span>
      </h1>
      <p class="subtitle">GRANDES COSAS ESTÁN EN CAMINO</p>
    </main>

    <footer class="bottom" aria-label="Estado de preparación">
      <svg class="mascot" viewBox="0 0 76 54" role="img" aria-label="Pequeño personaje con casco verde asomándose">
        <g class="body">
          <path d="M15 54V43c0-12 9-20 23-20s23 8 23 20v11Z" fill="#1e222e"/>
          <path d="M22 54V43c0-8 6-14 16-14s16 6 16 14v11Z" fill="#030716" stroke="#1e222e" stroke-width="1.4"/>
          <path d="M29 39c2-2 4-3 7-3s5 1 7 3" fill="none" stroke="#85a840" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <g class="head">
          <path d="M22 27c0-10 7-17 16-17s16 7 16 17v4H22Z" fill="#f1f1f1"/>
          <path d="M19 19c0-9 8-15 19-15s19 6 19 15v4H19Z" fill="#85a840"/>
          <path d="M17 22c0-2 1.6-3.5 3.5-3.5h35c1.9 0 3.5 1.5 3.5 3.5s-1.6 3.5-3.5 3.5h-35c-1.9 0-3.5-1.5-3.5-3.5Z" fill="#85a840"/>
          <path d="M27 13c2.4-2.2 5-3.1 8-3.1" fill="none" stroke="#f1f1f1" stroke-opacity=".6" stroke-width="1.3" stroke-linecap="round"/>
          <ellipse class="eye" cx="31" cy="27" rx="1.7" ry="2.5" fill="#030716"/>
          <ellipse class="eye" cx="45" cy="27" rx="1.7" ry="2.5" fill="#030716"/>
          <path d="M35 32q3 2 6 0" fill="none" stroke="#0cc0df" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="progress" role="progressbar" aria-label="Preparando el sitio" aria-valuetext="En proceso, sin porcentaje definido">
        <span class="progress-fill"></span>
      </div>
      <p class="loading">CARGANDO IDEAS<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></p>
    </footer>
  </div>
</body>
</html>
